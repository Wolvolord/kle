services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kle_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - kle_network
  nginx:
    image: nginx:alpine
    container_name: kle_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kle_network
  mysql:
    image: mysql:8.0
    container_name: kle_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kle
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: kle_user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kle_network

networks:
  kle_network:
    driver: bridge

volumes:
  mysql_data:
